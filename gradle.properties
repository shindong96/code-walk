pluginGroup=dev.shin.codewalk
pluginName=Code Walk
pluginVersion=0.3.0

# Rider 2026.2 (build 262). The plugin is pure IntelliJ Platform (Kotlin, frontend only) —
# it has no ReSharper backend part, so it runs unchanged in IntelliJ/PyCharm/etc.
platformSinceBuild=262
platformUntilBuild=262.*

# Build against the Rider that is installed locally instead of downloading an SDK.
# Override with -PriderPath=/path/to/Rider.app if yours lives elsewhere; when the path does not
# exist (CI), the build downloads Rider platformVersion from JetBrains instead.
riderPath=/Applications/Rider.app
platformVersion=2026.2.1

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
kotlin.stdlib.default.dependency=false
